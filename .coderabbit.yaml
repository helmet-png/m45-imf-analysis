# CodeRabbit 設定（免費方案，公開 repo 自動適用）。
# 安裝步驟見 PR 說明／README——這份檔案只負責「裝好之後怎麼審」，
# 不含任何金鑰，安裝本身要用你自己的 GitHub 帳號在 coderabbit.ai 授權。
language: "zh-TW"

reviews:
  profile: "chill"
  high_level_summary: true
  poem: false
  auto_review:
    enabled: true
    drafts: false
  # 2026-08-21 新增：查過 42 個 PR 裡有 41 個 CodeRabbit 留言完全沒人
  # 回覆，只是「沒人記得去檢查」——開啟後 CodeRabbit 會用真正的 GitHub
  # 「Request changes」審查狀態卡住 PR，等到 (1) 全部留言都 resolved、
  # (2) 最新一次 commit 已重新審過、(3) 沒有其他檢查失敗，才自動轉成
  # Approved。單靠這個設定還不會擋住合併，要搭配 GitHub branch
  # protection 把 main 分支的 required_approving_review_count 提高到
  # 至少 1（這個 repo 原本是 0，同一批改的），兩者一起才會讓合併按鈕
  # 真的被鎖住，不再需要靠任何人記得去查。
  # （2026-08-22：這個開關本身已經在 PR #100 先合併過一次，這裡合併
  # main 之後只是把本 PR 的另一份說明文字讓路給先合併的那份，設定
  # 本身沒有變。）
  request_changes_workflow: true
  path_filters:
    # 結果檔案（.npz/.csv/.json）跟快取的等時線網格不是給人看 diff 的，
    # 審這些只會製造噪音，排除掉。
    - "!results/**"
    # data/** 大部分是可重建的原始下載（Gaia 查詢結果、HR23 交叉比對），
    # 排除掉。**但下面三類是 fit_real.py／cluster_imf_tier1.py 等生產
    # 腳本直接讀取的執行期輸入**（成員表、誤差模型、選擇函數），不是
    # 單純的結果 diff 或快取——修改這些檔案時 CodeRabbit 必須看得到，
    # 才審得出模型契約有沒有被改掉（2026-08-26 CodeRabbit 回溯審查
    # PR #140 抓到原本整個 data/** 排除掉會連這三類一起藏住）。
    - "!data/**"
    - "data/*cmd_members.csv"
    - "data/*errmodel.npz"
    - "data/*selection.npz"
    - "!isochrones/**"
    - "!logs/**"
    - "!kaggle_work/**"
  path_instructions:
    - path: "injection_recovery.py"
      instructions: >
        multi_stage_best() 是這個專案共用的網格精修核心，被 fit_real.py／
        profile_lowmass.py／profile_outlierfrac.py／inject_lowmass.py 等
        生產腳本呼叫。2026-08-11 這裡曾經有過「refines 只給單一值時完全
        沒精修」的 bug（已修好）。任何改動這個函式的 PR，優先檢查：
        (1) 新參數的預設值是否讓既有呼叫者行為完全不變；
        (2) 精修迴圈是否每一階都真的重新呼叫 grid_best_parallel。
    - path: "pipeline/**"
      instructions: >
        這是 M45 前向模型的核心套件，被多個生產腳本共用。任何新增的
        cluster-specific 腳本（cluster_*.py）如果需要類似邏輯，優先檢查
        是否該在這裡加通用參數，而不是在呼叫端重新實作一份。
    - path: "LIMITATIONS.md"
      instructions: >
        這份檔案有明確的待辦分類標準（見 CLAUDE.md）：會影響已產出結果、
        或改變論文結論方向的問題要標成「現役缺陷」並附優先度，不能跟一般
        待辦敏感度測試混在一起排隊。審查時確認新增內容有沒有誤判成低優先。

chat:
  auto_reply: true
